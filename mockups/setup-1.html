<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course setup — YourTeeSheet</title>
<link rel="icon" href="../assets/img/favicon.svg">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>

<div class="demo-bar no-print">
  <div class="wrap">
    <span><strong>Mockup</strong> — setup wizard, step 1 of 4</span>
    <span><a href="index.html">All mockups</a></span>
  </div>
</div>

<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="landing.html">YourTeeSheet</a>
    <span class="masthead__sub">Setting up your course</span>
  </div>
</header>

<main class="shell-mid">
  <div class="big-card">
    <div class="kicker">Course setup · Step 1 of 4</div>
    <h1>Your course</h1>
    <form action="setup-2.html">
      <div class="field">
        <label for="name">Course name</label>
        <input type="text" id="name" value="Cedar Ridge Golf Club">
        <p class="field__hint" style="margin:.3rem 0 0">Shown at the top of your tee sheet and on everything you print.</p>
      </div>
      <div class="field">
        <label for="phone">Pro shop phone <span class="field__hint">— optional</span></label>
        <input type="tel" id="phone" value="(828) 555-0147">
      </div>
      <div class="form-foot">
        <span></span>
        <button class="btn btn--primary" type="submit" style="font-size:1.05rem">Next: tee times &rarr;</button>
      </div>
    </form>
  </div>
</main>

</body>
</html>
