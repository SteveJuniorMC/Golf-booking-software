name: Deploy demo to GitHub Pages

# The demo is plain static files at the repo root, so there is nothing to
# build — the whole checkout is uploaded as-is and published.

on:
  push:
    branches: [claude/golf-tee-booking-demo-pudsgd]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the demo
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo if it is not already enabled, so no
          # one has to visit the settings page first.
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
