name: Deploy demo to GitHub Pages

# The demo is plain static files at the repo root, so there is nothing to
# build — the whole checkout is uploaded as-is and published.

on:
  push:
    branches: [claude/golf-tee-booking-demo-pudsgd]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the demo
        uses: actions/checkout@v4

      # Requires Settings -> Pages -> Source: GitHub Actions to be set once,
      # by hand. The workflow token is not allowed to create the Pages site
      # itself, so this step fails with "Get Pages site failed / Not Found"
      # until that switch is flipped.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
