name: Deploy demo to GitHub Pages

# Stages the public files into _site with scripts/build-site.sh and publishes
# that directory, so the README, workflows, and anything else in the repo
# stay off the site.

on:
  push:
    branches: [claude/golf-tee-booking-demo-pudsgd]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the demo
        uses: actions/checkout@v4

      - name: Stage the site
        run: bash scripts/build-site.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
