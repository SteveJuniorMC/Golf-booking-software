name: Deploy demo to Cloudflare Pages

# The demo is plain static files, so there is nothing to build — the site
# files are staged into _site and uploaded as-is.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  from the right-hand side of any Cloudflare dashboard page

on:
  push:
    branches: [claude/golf-tee-booking-demo-pudsgd]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  PROJECT_NAME: golf-tee-booking-demo
  # Keeps wrangler from dropping into an interactive browser login when it has
  # no credentials — without this it waits instead of failing.
  CI: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Fail in seconds with a clear message rather than letting wrangler hang
      # waiting for a login that will never come.
      - name: Check the Cloudflare secrets are set
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under" \
                 "Settings > Secrets and variables > Actions. See the README."
            exit 1
          fi

      - name: Check out the demo
        uses: actions/checkout@v4

      # Ship only what a visitor needs — not the git history, the workflow,
      # or the README.
      - name: Stage the site
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'README.md' \
            ./ _site/
          ls -R _site

      # Creating a project that already exists is an error, which is fine and
      # expected on every run after the first.
      - name: Create the Pages project on the first run
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler pages project create "$PROJECT_NAME" \
            --production-branch "${{ github.ref_name }}"

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name=${{ env.PROJECT_NAME }}
            --branch=${{ github.ref_name }}
